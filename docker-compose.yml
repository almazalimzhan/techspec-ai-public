services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: techspec-ai-qdrant
    ports:
      - "6333:6333"
    volumes:
      - techspec-qdrant:/qdrant/storage

  backend:
    build: .
    container_name: techspec-ai-backend
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-litellm}
      LLM_MODEL: ${LLM_MODEL:-gemma3-27b-32bit}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://litellm-cloud.sk-ai.kz/v1}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      ALEM_MODEL: ${ALEM_MODEL:-astanahub/alemllm}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      OLLAMA_HOST: http://host.docker.internal:11434
      VECTOR_BACKEND: ${VECTOR_BACKEND:-qdrant}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-techspec_chunks}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-15}
      SESSION_BACKEND: sqlite
      SESSION_DB_PATH: /app/.runtime/techspec.db
      SESSION_TTL_SECONDS: 3600
      MAX_UPLOAD_BYTES: 26214400
      RATE_LIMIT_MAX_REQUESTS: 30
      RATE_LIMIT_WINDOW_SECONDS: 60
      USAGE_LOG_FILE: /app/.runtime/usage_logs.csv
      CORS_ALLOW_ORIGINS: http://localhost:8501,http://127.0.0.1:8501,http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - techspec-runtime:/app/.runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  techspec-runtime:
  techspec-qdrant:
